<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

	<title>Frontend Mentor | Stats preview card component</title>
	<link rel="stylesheet" href="./style.css">

</head>

<body>
	<div class="container">

		<article>

			<h1 class="header">Get <span class="insight">insights</span> that help your business grow.</h1>

			<p class="description">
				Discover the benefits of data analytics and make better decisions regarding revenue, customer
				experience, and overall efficiency.
			</p>

			<div class="stats-container">
				<div>
					<h3 class="quantity">10k+</h3>
					<span class="subheader">companies</span>
				</div>
				<div>
					<h3 class="quantity">314</h3>
					<span class="subheader">templates</span>
				</div>
				<div>
					<h3 class="quantity">12m+</h3>
					<span class="subheader">queries</span>
				</div>
			</div>

		</article>

		<img class="banner-image" src="./images/image-header-desktop.jpg" alt="banner image">

	</div>

	<div class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
		Coded by <a href="#">Your Name Here</a>.
	</div>
</body>

</html>
