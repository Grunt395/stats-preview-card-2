<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

	<title>Frontend Mentor | Stats preview card component</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
		rel="stylesheet">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&family=Lexend+Deca:wght@100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="./style.css">

</head>

<body>
	<div class="container">

		<article class="main-content">

			<h1 class="header">Get <span class="insight">insights</span> that help your business grow.</h1>

			<p class="description">
				Discover the benefits of data analytics and make better decisions regarding revenue, customer
				experience, and overall efficiency.
			</p>

			<div class="stats-container">
				<div>
					<h3 class="quantity">10k+</h3>
					<span class="stat-heading">companies</span>
				</div>
				<div>
					<h3 class="quantity">314</h3>
					<span class="stat-heading">templates</span>
				</div>
				<div>
					<h3 class="quantity">12M+</h3>
					<span class="stat-heading">queries</span>
				</div>
			</div>

		</article>

		<img class="main-image" src="./images/image-header-desktop.jpg" alt="banner image">

		<div class="color-source"></div>

	</div>

	<div class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
		Coded by <a href="https://github.com/Grunt395/stats-preview-card-2" target="_blank">Grant Lewandowski</a>.
	</div>
</body>

</html>
